<!DOCTYPE html>

<head>

  <title>De L'amour | Chuyển hướng Tra cứu đơn hàng</title>
  <script>
    // Tự động chuyển hướng sang trang chủ với modal tra cứu đơn tích hợp

    const q = params.get('q') || params.get('code') || params.get('phone') || '';
    const targetUrl = 'index.html?track=' + encodeURIComponent(q);
    window.location.replace(targetUrl);
  </script>
</head>
